<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помодоро-таймер</title>
<style>
  :root {
    --bg: #fbf7f4;
    --card: #ffffff;
    --text: #2b2421;
    --muted: #8a7d77;
    --line: #ece4df;
    --accent: #e5533d;
    --accent-soft: #fde3dd;
    --shadow: 0 10px 30px rgba(60, 30, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1716;
      --card: #252020;
      --text: #f3ece8;
      --muted: #a2948e;
      --line: #3a3230;
      --accent-soft: #4a2a24;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  body[data-mode="short"] { --accent: #2f9e74; --accent-soft: #d6f1e6; }
  body[data-mode="long"]  { --accent: #3b7dd8; --accent-soft: #dbe8fa; }
  @media (prefers-color-scheme: dark) {
    body[data-mode="short"] { --accent-soft: #1f3d32; }
    body[data-mode="long"]  { --accent-soft: #1f3150; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    transition: background .4s;
  }
  main { width: 100%; max-width: 440px; display: grid; gap: 20px; align-content: start; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; }

  .tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 999px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 4px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .ring { position: relative; width: 260px; max-width: 100%; aspect-ratio: 1; margin: 24px auto 8px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--accent-soft); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .4s; }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .time { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .label { color: var(--muted); font-size: 14px; }

  .controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
  .btn {
    border: 0; cursor: pointer; font: inherit; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); width: 48px; height: 48px; font-size: 18px;
  }
  .btn.main { width: auto; padding: 0 36px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px; }
  .btn:active { transform: scale(.96); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }

  .tomatoes { display: flex; justify-content: space-between; align-items: center; }
  .tomatoes strong { font-size: 15px; }
  .dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; font-size: 18px; min-height: 24px; }

  h2 { font-size: 15px; margin: 0 0 12px; }
  form.add { display: flex; gap: 8px; }
  form.add input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font: inherit;
  }
  form.add button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  li label { flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; word-break: break-word; }
  li input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li .pomos { color: var(--muted); font-size: 13px; }
  li .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  li.active { color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; margin-top: 12px; }

  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  .settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .settings label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  .settings input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 8px; font: inherit;
  }
</style>
</head>
<body data-mode="focus">
<main>
  <section class="card">
    <div class="tabs" role="group" aria-label="Режим">
      <button data-mode="focus">Фокус</button>
      <button data-mode="short">Перерыв</button>
      <button data-mode="long">Длинный</button>
    </div>

    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="bar" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="center">
        <div class="time" id="time">25:00</div>
        <div class="label" id="label">Время сосредоточиться</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="reset" title="Сбросить (R)">↺</button>
      <button class="btn main" id="toggle">Старт</button>
      <button class="btn" id="skip" title="Пропустить (S)">⏭</button>
    </div>
    <div class="hint">Пробел — старт/пауза · R — сброс · S — пропустить</div>
  </section>

  <section class="card tomatoes">
    <strong>Сегодня: <span id="count">0</span></strong>
    <div class="dots" id="dots"></div>
  </section>

  <section class="card">
    <h2>Задачи</h2>
    <form class="add" id="addForm">
      <input id="taskInput" placeholder="Над чем работаем?" maxlength="120" autocomplete="off">
      <button>Добавить</button>
    </form>
    <ul id="tasks"></ul>
    <div class="empty" id="empty">Добавь задачу. Отмеченная кружком будет получать помидоры.</div>
  </section>

  <section class="card">
    <details>
      <summary>Настройки (минуты)</summary>
      <div class="settings">
        <label>Фокус <input type="number" min="1" max="120" data-set="focus"></label>
        <label>Перерыв <input type="number" min="1" max="60" data-set="short"></label>
        <label>Длинный <input type="number" min="1" max="60" data-set="long"></label>
      </div>
    </details>
  </section>
</main>

<script>
(() => {
  const LABELS = { focus: 'Время сосредоточиться', short: 'Короткий отдых', long: 'Длинный отдых' };
  const today = new Date().toISOString().slice(0, 10);

  const load = (key, fallback) => {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
  };
  const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

  const durations = Object.assign({ focus: 25, short: 5, long: 15 }, load('pomo.durations', {}));
  let tasks = load('pomo.tasks', []);
  let stats = load('pomo.stats', { date: today, count: 0 });
  if (stats.date !== today) stats = { date: today, count: 0 };

  let mode = 'focus';
  let total = durations.focus * 60;
  let remaining = total;
  let endAt = null;   // timestamp when running, null when paused
  let tick = null;

  const $ = (id) => document.getElementById(id);
  const bar = document.querySelector('.bar');
  const CIRC = 2 * Math.PI * 54;
  bar.style.strokeDasharray = CIRC;

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  function render() {
    const s = Math.ceil(remaining);
    $('time').textContent = fmt(s);
    $('label').textContent = LABELS[mode];
    bar.style.strokeDashoffset = CIRC * (1 - remaining / total);
    $('toggle').textContent = endAt ? 'Пауза' : (remaining < total ? 'Продолжить' : 'Старт');
    document.title = endAt ? `${fmt(s)} · ${mode === 'focus' ? 'Фокус' : 'Отдых'}` : 'Помодоро-таймер';
    document.body.dataset.mode = mode;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  }

  function renderStats() {
    $('count').textContent = stats.count;
    $('dots').textContent = '🍅'.repeat(Math.min(stats.count, 16)) + (stats.count > 16 ? ' +' + (stats.count - 16) : '');
  }

  function renderTasks() {
    const ul = $('tasks');
    ul.innerHTML = '';
    $('empty').hidden = tasks.length > 0;
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = (t.done ? 'done ' : '') + (t.active ? 'active' : '');
      li.innerHTML = `
        <input type="radio" name="active" title="Сделать текущей" ${t.active ? 'checked' : ''}>
        <label><input type="checkbox" ${t.done ? 'checked' : ''}><span></span></label>
        <span class="pomos">${t.pomos ? '🍅×' + t.pomos : ''}</span>
        <button class="del" title="Удалить">×</button>`;
      li.querySelector('label span').textContent = t.text;
      li.querySelector('input[type=radio]').onchange = () => { tasks.forEach((x, j) => x.active = j === i); persistTasks(); };
      li.querySelector('input[type=checkbox]').onchange = (e) => { t.done = e.target.checked; persistTasks(); };
      li.querySelector('.del').onclick = () => { tasks.splice(i, 1); persistTasks(); };
      ul.appendChild(li);
    });
  }
  function persistTasks() { save('pomo.tasks', tasks); renderTasks(); }

  function setMode(m) {
    pause();
    mode = m;
    total = remaining = durations[m] * 60;
    render();
  }

  function start() {
    if (endAt) return;
    endAt = Date.now() + remaining * 1000;
    tick = setInterval(update, 250);
    render();
  }
  function pause() {
    if (!endAt) return;
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    endAt = null;
    clearInterval(tick);
    render();
  }
  function update() {
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    if (remaining <= 0) return finish();
    render();
  }

  function finish() {
    endAt = null;
    clearInterval(tick);
    chime();
    if (mode === 'focus') {
      stats.count++;
      save('pomo.stats', stats);
      renderStats();
      const active = tasks.find(t => t.active && !t.done);
      if (active) { active.pomos = (active.pomos || 0) + 1; persistTasks(); }
      notify('Помидор готов! 🍅', 'Время отдохнуть.');
      setMode(stats.count % 4 === 0 ? 'long' : 'short');
    } else {
      notify('Перерыв окончен', 'Возвращаемся к делу.');
      setMode('focus');
    }
  }

  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 1);
      });
    } catch {}
  }

  function notify(title, body) {
    try {
      if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
    } catch {}
  }

  // Events
  $('toggle').onclick = () => {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    endAt ? pause() : start();
  };
  $('reset').onclick = () => setMode(mode);
  // Skipping moves to the next phase without awarding a tomato
  $('skip').onclick = () => setMode(mode === 'focus' ? 'short' : 'focus');
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

  $('addForm').onsubmit = (e) => {
    e.preventDefault();
    const text = $('taskInput').value.trim();
    if (!text) return;
    tasks.push({ text, done: false, pomos: 0, active: !tasks.some(t => t.active) });
    $('taskInput').value = '';
    persistTasks();
  };

  document.querySelectorAll('[data-set]').forEach(inp => {
    inp.value = durations[inp.dataset.set];
    inp.onchange = () => {
      const v = Math.min(+inp.max, Math.max(1, Math.round(+inp.value) || 1));
      inp.value = v;
      durations[inp.dataset.set] = v;
      save('pomo.durations', durations);
      if (inp.dataset.set === mode && !endAt && remaining === total) setMode(mode);
    };
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    if (e.code === 'Space') { e.preventDefault(); $('toggle').click(); }
    else if (e.code === 'KeyR') $('reset').click();
    else if (e.code === 'KeyS') $('skip').click();
  });

  setMode('focus');
  renderStats();
  renderTasks();
})();
</script>
</body>
</html>
